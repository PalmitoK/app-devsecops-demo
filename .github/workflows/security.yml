name: Security — Análisis de seguridad

on:
  push:
    branches: [ 'main', 'develop' ]
  pull_request:
    branches: [ 'main' ]
  schedule:
    - cron: '0 3 * * 1'   # Ejecución programada todos los lunes a las 03:00 UTC (detecta vulnerabilidades del día 0)

permissions:
  contents: read
  security-events: write   # Permiso obligatorio para escribir reportes en la pestaña Security de GitHub

jobs:
  # Capa 1: SAST - Análisis de código estático con CodeQL
  codeql:
    name: SAST — CodeQL
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # Descarga todo el historial de commits para un análisis más exhaustivo

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended  # Activa las reglas de seguridad extendidas para mayor protección

      - name: Auto-build de CodeQL
        uses: github/codeql-action/autobuild@v3

      - name: Ejecutar análisis semántico
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'

  # Capa 2: SCA - Auditoría de dependencias con npm audit
  sca-npm:
    name: SCA — npm audit
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias limpias
        run: npm ci

      - name: Auditoría de dependencias
        run: npm audit --audit-level=high # El pipeline fallará solo ante vulnerabilidades de nivel Alto o Crítico

  # Capa 3: Secret Scanning - Escaneo de credenciales con Gitleaks
  gitleaks:
    name: Secret Scanning — Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Descargar todo el historial
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ejecutar Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Token automático proporcionado por GitHub